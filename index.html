<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찾아가는 세미나 자동배정 v2</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--mut:#64707f;--line:#e3e7ed;--pri:#2456e6;--pri2:#e9efff;--ok:#0e8a5e;--ok2:#e1f5ec;--warn:#a85f00;--warn2:#fff2d9;--bad:#c62f2b;--bad2:#fde9e8;--gray2:#f0f2f6;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.05);--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#171f29;--ink:#e8edf2;--mut:#93a0ae;--line:#283341;--pri:#7aa5ff;--pri2:#1b2a48;--ok:#4cc79b;--ok2:#12372c;--warn:#f0b15a;--warn2:#3b2c12;--bad:#ff8080;--bad2:#432020;--gray2:#202a35;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:58px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo:before{content:"";width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--pri),#6f93ff)}
.logo small{color:var(--mut);font-weight:500;font-size:12px;background:var(--gray2);padding:2px 8px;border-radius:20px}
.hr{display:flex;align-items:center;gap:10px}
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
aside{width:210px;flex:none;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:14px 10px}
.sg{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.04em;padding:14px 12px 6px}
.nav{padding:9px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px;display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500}
.nav .ic{width:22px;text-align:center;font-size:16px}
.nav .tx{flex:1}
.nav:hover{background:var(--gray2)}
.nav.active{background:var(--pri2);color:var(--pri);font-weight:700}
.dot{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:0 7px;min-width:20px;text-align:center;line-height:18px}
main{flex:1;padding:28px 32px 60px;min-width:0;max-width:1320px;margin:0 auto}
.page{display:none}.page.active{display:block}
h1{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-.03em}
h4{margin:18px 0 8px;font-size:14px}
.desc{color:var(--mut);margin-bottom:20px;max-width:760px}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow)}
.ph{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:15px}
.ph .sub{font-weight:400}
.pb{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{color:var(--mut);font-size:12.5px;display:block}.kpi strong{font-size:26px;font-weight:800;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13.5px}
th{color:var(--mut);font-weight:600;background:var(--gray2);white-space:nowrap;font-size:12.5px;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tbody tr:hover td,table tr:hover>td{background:color-mix(in srgb,var(--pri2) 45%,transparent)}
.tw{overflow:auto;max-height:68vh}
.tw>table{min-width:880px}
td,th{word-break:keep-all;overflow-wrap:anywhere}
td:first-child{min-width:150px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;text-decoration:none;transition:.12s}
.btn:hover{background:var(--gray2);border-color:color-mix(in srgb,var(--line) 60%,var(--mut))}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.pri:hover{filter:brightness(1.08);background:var(--pri)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}.btn.bad:hover{background:var(--bad2)}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:100%;transition:.12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--pri)}
textarea{width:100%;min-height:110px}
label{font-size:12.5px;font-weight:600;color:var(--mut);display:block;margin-bottom:5px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.fg input,.fg select{width:100%}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--gray2);color:var(--mut);white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}

.sub{color:var(--mut);font-size:12.5px}
.notice{background:var(--pri2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.notice.warn{background:var(--warn2)}.notice.bad{background:var(--bad2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.week{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;overflow:auto}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:140px;box-shadow:var(--shadow)}
.dh{padding:10px 12px;font-weight:800;border-bottom:1px solid var(--line);background:var(--gray2);border-radius:var(--r) var(--r) 0 0}
.ev{margin:8px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);cursor:pointer;font-size:13px;background:var(--card);transition:.12s}
.ev:hover{box-shadow:var(--shadow);transform:translateY(-1px)}

.ev.old{background:var(--gray2);cursor:default;color:var(--mut);box-shadow:none;transform:none}
.bar{height:22px;background:var(--pri2);border-radius:6px;position:relative;margin:5px 0}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px;opacity:.85}
.bar span{position:absolute;left:10px;top:0;font-size:12.5px;line-height:22px;color:var(--ink);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,26,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:min(660px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.big{width:min(920px,100%)}

.mb{padding:20px}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--mut);line-height:1}

.step:last-child{border-right:0}
.step small{color:var(--mut);font-weight:600;font-size:12px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>.panel{margin-bottom:18px}

@media (max-width:820px){
 .layout{flex-direction:column}
 aside{position:static;width:100%;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
 .sg{display:none}.nav{white-space:nowrap;margin:0}
 main{padding:16px 14px 50px}h1{font-size:22px}
 header{padding:0 12px}.logo small{display:none}

</style>
</head>

</div>

function zMatch(z,loc){if(!loc)return false;const p=loc.split(' ');return z.cities.some(t=>t===loc||t===p[0]||t===(p[1]||'').replace(/[시군]$/,''))}
function zoneFor(loc){return S.zones.find(z=>zMatch(z,loc))}
function dist(a,b){const A=coord(a),B=coord(b);if(!A||!B)return null;const R=6371,r=x=>x*Math.PI/180,dl=r(B[0]-A[0]),dn=r(B[1]-A[1]);const h=Math.sin(dl/2)**2+Math.cos(r(A[0]))*Math.cos(r(B[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function travelMin(a,b){if(!a||!b)return null;if(a===b)return METRO.includes(a)?S.settings.metroIntra:S.settings.sameCity;const d=dist(a,b);if(d==null)return null;const road=d*1.3,s=S.settings,town=50;const t=road<=town?road/s.speed*60:town/s.speed*60+(road-town)/s.hwySpeed*60;return Math.max(15,Math.round(t))}

function check(cand,st,base){
  const R=[],W=[],legs=[];let travel=0;const B=S.settings.buffer;
  if(!st.active)R.push('비활성 담당자');
  if(!dayOK(cand.date))R.push('날짜 오류');else if(dow(cand.date)%6===0)R.push('주말');else if((S.settings.holidays||[]).includes(cand.date))R.push('공휴일/휴무일');
  if(!cand.city)R.push('주소/지역 확인 필요');
  else{const z=zoneFor(cand.city);if(!z)R.push('해당 지역 세미나 기간 미설정');else if(cand.date<z.start||cand.date>z.end)R.push('지역 세미나 기간 밖');}
  if(st.off.some(o=>o.date===cand.date))R.push('담당자 불가일');
  if(S.declines.some(d=>!d.revoked&&d.companyId===cand.companyId&&d.staffId===st.id))R.push('이 업체 불가 표시');
  if(cand.fixed&&cand.fixed!==st.id)R.push('지정 담당자 조건');
  const sem=base.filter(s=>s.staffId===st.id&&s.date===cand.date&&s.companyId!==cand.companyId);
  if(sem.length>=st.max)R.push('하루 최대 '+st.max+'건');
  const tl=[...evsFor(st.id,cand.date).map(e=>({start:e.start,end:e.end,city:e.city,title:e.title})),...sem.map(s=>({start:s.start,end:s.end,city:s.city,title:cname(s.companyId)}))];
  for(const e of tl)if(cand.start<e.end&&e.start<cand.end)R.push('시간 중복: '+e.title);
  const m0=cand.city?travelMin(st.base,cand.city):null,LT=S.settings.longTripMin;
  if(m0!=null&&m0>=LT){if(tl.length)R.push('장거리 출장일: 하루 1건·다른 일정 불가');if(cand.end+m0>S.settings.returnLatest){if(S.settings.allowOvernight)W.push('숙박 출장 필요 (당일 복귀 불가)');else R.push('당일 복귀 불가 (숙박 출장 필요)')}else W.push('장거리 출장 (편도 약 '+m0+'분)')}
  if(sem.some(s=>{const mm=travelMin(st.base,s.city);return mm!=null&&mm>=LT}))R.push('같은 날 장거리 출장 일정 있음');
  if(extOn()&&!EXT.ok)W.push('기존 일정 연동 미확인 — 충돌 확인 필요');
  const prev=tl.filter(e=>e.end<=cand.start).sort((a,b)=>b.end-a.end)[0],next=tl.filter(e=>e.start>=cand.end).sort((a,b)=>a.start-b.start)[0];
  const leg=(a,b,aEnd,bStart,label)=>{
    if(!a||!b){W.push('위치 미입력 · 이동시간 확인 ('+label+')');return}
    const m=travelMin(a,b);if(m==null){R.push('이동시간 계산 불가 (지역 좌표 없음)');return}
    travel+=m;legs.push({from:a,to:b,min:m,km:Math.round((dist(a,b)||0)*1.3),gap:bStart-aEnd});
    if(bStart-aEnd<m+B)R.push('이동시간 부족 ('+m+'분+여유 '+B+'분)');
  };
  if(prev)leg(prev.city,cand.city,prev.end,cand.start,prev.title);
  else if(cand.city){const m=travelMin(st.base,cand.city);if(m!=null){travel+=m;legs.push({from:st.base,to:cand.city,min:m,km:Math.round((dist(st.base,cand.city)||0)*1.3),gap:null,fromBase:true});if(S.settings.departEarliest+m>cand.start)R.push('출발지('+st.base+')에서 도착 불가');}}
  if(next)leg(cand.city,next.city,cand.end,next.start,next.title);
  return {ok:!R.length,reasons:[...new Set(R)],warnings:[...new Set(W)],travel,legs};
}
function candidateFor(c,date,start){return {companyId:c.id,date,start,end:start+S.settings.duration,city:c.city||locOf(c.address),address:c.address,fixed:c.fixedStaffId}}
function slots(){return S.settings.slots.filter(t=>t+S.settings.duration<=1080)}

function plan(targets,base){
  let beam=[{items:[],cost:0}];
  targets=[...targets].sort((a,b)=>(!!b.fixedStaffId)-(!!a.fixedStaffId)||a.prefs.length-b.prefs.length);
  for(const c of targets){const next=[];
    for(const stt of beam){next.push(stt);
      c.prefs.forEach((date,rank)=>{for(const p of S.staff)for(const t of slots()){
        const cand=candidateFor(c,date,t),all=[...base,...stt.items],r=check(cand,p,all);if(!r.ok)continue;
        const load=all.filter(s=>s.staffId===p.id).length;
        next.push({items:[...stt.items,{...cand,staffId:p.id,rank,travel:r.travel,legs:r.legs,warns:r.warnings}],cost:stt.cost+rank*100+r.travel+load*25});
      }});}
    beam=next.sort((a,b)=>b.items.length-a.items.length||a.cost-b.cost).slice(0,40);}
  return beam[0].items;
}
function diagnose(c){
  const cnt={};if(c.prefs.length<3)return ['희망일 미회신'];
  for(const date of c.prefs)for(const p of S.staff)for(const t of slots()){const r=check(candidateFor(c,date,t),p,liveSem());r.reasons.forEach(x=>cnt[x]=(cnt[x]||0)+1)}
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
}
function autoAssign(silent){
  S.seminars=S.seminars.filter(s=>s.status!=='proposed');
  const base=S.seminars.filter(s=>['confirmed','done'].includes(s.status));
  const targets=S.companies.filter(c=>!c.x&&c.prefs.length===3&&!semOf(c)&&!S.calls.some(k=>!k.done&&k.companyId===c.id));
  const items=plan(targets,base);
  items.forEach(i=>S.seminars.push({id:uid('S'),companyId:i.companyId,staffId:i.staffId,date:i.date,start:i.start,end:i.end,city:i.city,address:i.address,status:S.settings.autoConfirm?'confirmed':'proposed',rank:i.rank,travel:i.travel,legs:i.legs,warns:i.warns,note:'',createdAt:now()}));
  const miss=targets.filter(c=>!items.some(i=>i.companyId===c.id));
  if(!silent){logit('자동배정: '+items.length+'건 제안, 미배정 '+miss.length+'건');
    if(miss.length)addAlarm('warn','자동배정 미배정 '+miss.length+'건',miss.map(c=>c.name).join(', ')+' — 배정 일정 화면에서 사유를 확인하세요.');
    toast('자동배정 완료: '+items.length+'건 배정, '+miss.length+'건 미배정');}

}
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
function logit(t){S.log.unshift({at:now(),t});S.log=S.log.slice(0,200)}
function semOf(c){return S.seminars.filter(s=>s.companyId===c.id&&['proposed','confirmed','done'].includes(s.status))[0]}
function statusOf(c){
  if(c.x)return 'X 진행 안 함';const s=semOf(c);
  if(s)return s.status==='done'?'진행완료':s.status==='confirmed'?'확정':'배정제안';

function declineDialog(id){
  const s=S.seminars.find(x=>x.id===id);
  openModal('담당자 불가 표시',`<p><b>${esc(cname(s.companyId))}</b> · ${fmtD(s.date)} ${fmtT(s.start)} · ${esc(sname(s.staffId))}</p><label>불가 사유 (개인 사유)</label><textarea id="declReason" placeholder="예: 개인 사정"></textarea><p class="sub">표시하면 관리자에게 알람이 뜨고, 근처 담당자 중 이동시간과 다음 일정이 맞는 사람으로 자동 재배정을 시도합니다.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">취소</button><button class="btn bad" onclick="doDecline('${id}')">불가로 표시</button></div>`);
}
function doDecline(id){
  const reason=$('declReason').value.trim()||'(사유 미입력)';closeModal();
  const s=S.seminars.find(x=>x.id===id);const prev=s.status;
  s.status='declined';S.declines.push({id:uid('D'),seminarId:id,companyId:s.companyId,staffId:s.staffId,reason,at:now(),by:role==='admin'?'관리자(대리)':sname(role),revoked:false,prevStatus:prev});
  logit(sname(s.staffId)+' 불가 표시: '+cname(s.companyId)+' ('+reason+')');
  addAlarm('warn','담당자 불가: '+sname(s.staffId),cname(s.companyId)+' '+fmtD(s.date)+' '+fmtT(s.start)+' — 사유: '+reason,{companyId:s.companyId,seminarId:id});
  const cands=findSubs(s);
  if(cands.length&&S.settings.autoReassign){
    const best=cands[0];const n=makeSem(s,best,prev==='confirmed'?'confirmed':'proposed');
    addAlarm('info','대체 배정 완료',cname(s.companyId)+' → '+sname(best.staffId)+' ('+fmtD(best.date)+' '+fmtT(best.start)+', 이동 '+best.travel+'분). '+(prev==='confirmed'?'시공사에 변경 안내 메일을 보내세요.':''),{companyId:s.companyId,seminarId:n.id});
  }else if(cands.length){addAlarm('warn','대체 담당자 선택 필요',cname(s.companyId)+' — 후보 '+cands.length+'명. 배정 일정에서 [대타 찾기]를 눌러 선택하세요.',{companyId:s.companyId,seminarId:id});}
  else raiseCall(s,'담당자 불가('+sname(s.staffId)+': '+reason+') 후 검증된 대체 담당자·날짜가 없음');
  save();renderAll();
}
function makeSem(old,c,status){const n={id:uid('S'),companyId:old.companyId,staffId:c.staffId,date:c.date,start:c.start,end:c.end,city:c.city,address:c.address,status,rank:c.rank,travel:c.travel,legs:c.legs,warns:c.warns,note:'대체 배정 (원 담당 '+sname(old.staffId)+')',createdAt:now()};S.seminars.push(n);return n}
function raiseCall(s,reason){
  S.calls.push({id:uid('C'),companyId:s.companyId,seminarId:s.id,reason,at:now(),done:false});
  addAlarm('urgent','긴급: '+cname(s.companyId)+' 사과 전화 필요',reason,{companyId:s.companyId,seminarId:s.id});
  logit('긴급 전화 필요: '+cname(s.companyId));showUrgent();
}
function findSubs(old){
  const c=comp(old.companyId),base=liveSem().filter(x=>x.id!==old.id),out=[];
  c.prefs.forEach((date,rank)=>{for(const p of S.staff){if(p.id===old.staffId)continue;for(const t of slots()){
    const cand=candidateFor(c,date,t),r=check(cand,p,base);if(!r.ok)continue;
    const load=base.filter(x=>x.staffId===p.id).length;
    out.push({...cand,staffId:p.id,rank,travel:r.travel,legs:r.legs,warns:r.warnings,cost:(date!==old.date?200:0)+(t!==old.start?15:0)+r.travel*2+load*25+rank*20});
  }}});
  return out.sort((a,b)=>a.cost-b.cost).slice(0,8);
}
function revokeDecline(did){
  const d=S.declines.find(x=>x.id===did),s=S.seminars.find(x=>x.id===d.seminarId);
  if(S.seminars.some(x=>x.companyId===d.companyId&&x.note.includes('원 담당 '+sname(d.staffId))&&['proposed','confirmed','done'].includes(x.status)))return alert('이미 대체 배정이 진행되어 철회할 수 없습니다. 대체 일정을 먼저 취소하세요.');
  d.revoked=true;if(s&&s.status==='declined')s.status=d.prevStatus;
  S.calls.filter(k=>k.seminarId===d.seminarId&&!k.done).forEach(k=>k.done=true);
  logit('불가 철회: '+sname(d.staffId));save();renderAll();toast('불가 표시를 철회했습니다.');
}

  $('urgent').classList.add('show');
}

  <div class="panel"><div class="ph">② 회신 자동 취합 <span><button class="btn pri" onclick="collect()">새 응답 확인 (${S.inbox.length}건 대기)</button></span></div><div class="pb">

   ${S.inbox.length?`<table><tr><th>수신</th><th>업체</th><th>인원</th><th>주소</th><th>1·2·3순위</th></tr>${S.inbox.map(r=>`<tr><td>${esc(r.at)}</td><td>${esc(r.name)}</td><td>${r.people}</td><td>${esc(r.address)}</td><td>${[r.d1,r.d2,r.d3].map(fmtD).join(', ')}</td></tr>`).join('')}</table>`:'<div class="sub">대기 중인 새 응답이 없습니다.</div>'}
   ${S.respErrors.length?`<h4>처리 오류 (수정 필요)</h4>`+S.respErrors.map((e,i)=>`<div class="alarm warn"><b>${esc(e.r.name)}</b> — ${esc(e.errs.join(' / '))} <button class="btn sm" onclick="S.respErrors.splice(${i},1);renderAll()">닫기</button></div>`).join(''):''}
   <details style="margin-top:10px"><summary>응답 직접 붙여넣기 (CSV: 업체명,담당자,연락처,인원,주소,1순위,2순위,3순위)</summary><textarea id="pasteResp" placeholder="태성건설,김담당,010-1234-5678,5,경기도 화성시 ...,2026-12-02,2026-12-03,2026-12-04"></textarea><button class="btn" onclick="pasteResponses()">붙여넣은 응답 반영</button></details></div></div>

function insTok(k){const ta=$('tb');ta.value=ta.value.slice(0,ta.selectionStart)+k+ta.value.slice(ta.selectionEnd)}
function saveTpl(){const t=S.tpls.find(x=>x.id===ui.tplId);t.name=$('tn').value||'양식';t.subject=$('ts').value;t.body=$('tb').value;save();rMail();toast('저장했습니다.')}
function addTpl(){const t={id:uid('t'),name:'새 양식',subject:'',body:''};S.tpls.push(t);ui.tplId=t.id;rMail()}
function delTpl(){if(S.tpls.length<2||!confirm('삭제할까요?'))return;S.tpls=S.tpls.filter(x=>x.id!==ui.tplId);ui.tplId=S.tpls[0].id;rMail()}
function sendMails(){
  const zsel=ui.mailZone||'';const list=S.companies.filter(c=>!c.mail.sent&&!c.x&&(!zsel||zoneFor(c.city)?.id===zsel));
  if(!confirm(list.length+'곳에 발송 처리할까요? (시뮬레이션: 실제 메일은 나가지 않습니다)'))return;

}
function applyResponse(r){
  const errs=[],name=r.name.trim(),addr=r.address.trim(),city=cityOf(addr),dates=[r.d1,r.d2,r.d3],ppl=+r.people;
  if(!name)errs.push('업체명 없음');if(!addr)errs.push('주소 없음');else if(!city)errs.push('주소에서 지역 인식 실패');
  if(!(ppl>=3))errs.push('인원 3명 미만');
  if(!dates.every(dayOK))errs.push('날짜 형식 오류');else if(new Set(dates).size<3)errs.push('희망일 중복');
  const z=city&&zoneFor(city);if(city&&!z)errs.push(city+' 권역 기간 미설정');
  else if(z&&dates.every(dayOK)&&dates.some(d=>d<z.start||d>z.end))errs.push('희망일이 '+z.name+' 기간('+z.start+'~'+z.end+') 밖');
  if(errs.length)return errs;
  let c=S.companies.find(x=>x.name===name),isNew=false;
  if(!c){isNew=true;c={id:'HS-'+String(S.companies.length+1).padStart(4,'0'),name,city,address:addr,x:false,fixedStaffId:'',contact:'',phone:'',email:'',people:ppl,rep:'',replyFlag:'',callChecked:'',memo:'',mail:{sent:false,sentAt:'',replied:false,repliedAt:'',resend:0},prefs:[],hist:{2025:{done:false}}};S.companies.push(c)}
  Object.assign(c,{address:addr,city,people:ppl,contact:r.contact||c.contact,phone:r.phone||c.phone});
  c.prefs=dates;c.mail.replied=true;c.mail.repliedAt=now().slice(0,10);c.replyFlag='';
  S.seminars=S.seminars.filter(s=>!(s.companyId===c.id&&s.status==='proposed'));
  if(isNew)logit('미등록 업체 신규 등록: '+name);return [];
}
function collect(){
  if(!S.inbox.length)return toast('새 응답이 없습니다.');
  let ok=0,bad=0;S.inbox.forEach(r=>{const e=applyResponse(r);if(e.length){bad++;S.respErrors.push({r,errs:e})}else ok++});
  S.inbox=[];logit('회신 취합: 성공 '+ok+' / 오류 '+bad);
  addAlarm(bad?'warn':'info','신규 회신 취합',ok+'건 반영'+(bad?', '+bad+'건 오류(메일·회신 화면 확인)':''));

}
function pasteResponses(){

  <div class="week">${days.map(d=>`<div class="day"><div class="dh" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" title="클릭하면 이 날의 동선을 봅니다" onclick="dayRoute('${d}')"><span>${fmtD(d)}</span><span class="sub">🧭 동선</span></div>${evs.filter(e=>e.date===d).map(e=>`<div class="ev old"><b>${esc(e.title)}</b> (기존)<br>${e.end-e.start>=540?'종일':fmtT(e.start)+'–'+fmtT(e.end)} · ${esc(sname(e.staffId))}${e.city?' · '+esc(e.city):''}</div>`).join('')}

}
function sOff(id){const p=S.staff.find(s=>s.id===id);return '<div style="margin-top:8px">'+(p.off.map((o,i)=>`<span class="badge b-warn">${fmtD(o.date)} ${esc(o.reason)} <a href="#" onclick="rmOff('${id}',${i});return false">×</a></span> `).join('')||'<span class="sub">등록된 불가일 없음</span>')+'</div>'}
function addOff(id){const d=$('offD').value;if(!dayOK(d))return alert('날짜를 선택하세요.');const p=S.staff.find(s=>s.id===id);p.off.push({date:d,reason:$('offR').value||'개인 사유'});

function rRoute(){

  const date=ui.routeDate&&dates.includes(ui.routeDate)?ui.routeDate:dates[0]||'';
  const p=S.staff.find(x=>x.id===sid);
  const items=date?[...evsFor(sid,date).map(e=>({start:e.start,end:e.end,city:e.city,title:e.title+' (기존)',old:1})),...S.seminars.filter(s=>s.staffId===sid&&s.date===date&&['proposed','confirmed'].includes(s.status)).map(s=>({start:s.start,end:s.end,city:s.city,title:cname(s.companyId)}))].sort((a,b)=>a.start-b.start):[];
  const pts=[{city:p.base,title:'출발지'},...items.filter(i=>i.city)].filter(q=>coord(q.city));
  const X=c=>20+((coord(c)[1]-125.9)/4.1)*600,Y=c=>20+((38.6-coord(c)[0])/5.6)*400;

  $('p-route').innerHTML=`<div class="title-row"><div><h1>동선·이동시간</h1><div class="desc">시·군 좌표 기반 추정(직선거리×1.3, 시내 시속 ${S.settings.speed}km·고속 ${S.settings.hwySpeed}km). 지도 API 연결 시 실제 값으로 교체됩니다.</div></div></div>
  <div class="row" style="margin-bottom:10px">${role==='admin'?`<select onchange="ui.routeStaff=this.value;ui.routeDate='';rRoute()">${S.staff.map(x=>`<option value="${x.id}" ${x.id===sid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:'<b>'+esc(p.name)+'</b>'}
   <select onchange="ui.routeDate=this.value;rRoute()">${dates.map(d=>`<option value="${d}" ${d===date?'selected':''}>${fmtD(d)}</option>`).join('')||'<option>배정 없음</option>'}</select><span class="sub">출발지: ${esc(p.base)}</span></div>
  <div class="panel"><div class="pb"><svg viewBox="0 0 640 440" style="width:100%;max-height:440px;background:var(--gray2);border-radius:8px">${[...new Set([...METRO,...pts.map(q=>q.city)])].map(c=>`<circle cx="${X(c)}" cy="${Y(c)}" r="3" fill="var(--mut)"/><text x="${X(c)+5}" y="${Y(c)-4}">${c}</text>`).join('')}
   ${pts.length>1?`<polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="${pts.map(q=>X(q.city||q)+','+Y(q.city||q)).join(' ')}"/>`:''}
   ${pts.map((q,i)=>`<circle cx="${X(q.city)}" cy="${Y(q.city)}" r="10" fill="${i?'var(--pri)':'var(--ok)'}"/><text x="${X(q.city)}" y="${Y(q.city)+4}" text-anchor="middle" style="fill:#fff;font-weight:700">${i||'S'}</text>`).join('')}</svg></div></div>
  <div class="panel"><div class="tw"><table><tr><th>시간</th><th>일정</th><th>지역</th><th>이동</th></tr>${rows||'<tr><td colspan=4 class="sub">선택한 날짜에 일정이 없습니다.</td></tr>'}</table></div></div>`;
}

   <div class="tw"><table><tr><th>담당자</th><th>날짜</th><th>시간</th><th>일정</th><th>위치</th><th></th></tr>${[...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr><td>${esc(sname(e.staffId))}</td><td>${fmtD(e.date)}</td><td>${fmtT(e.start)}–${fmtT(e.end)}</td><td>${esc(e.title)}</td><td>${esc(e.city||'-')}</td><td><button class="btn sm bad" onclick="S.events=S.events.filter(x=>x.id!='${e.id}');renderAll()">삭제</button></td></tr>`).join('')}</table></div></div>

/* ---------- 알람센터 ---------- */
function alarmHtml(a){return `<div class="alarm ${a.level} ${a.read?'read':''}"><div class="row" style="justify-content:space-between"><b>${a.level==='urgent'?'🚨 ':a.level==='warn'?'⚠ ':'ℹ '}${esc(a.title)}</b><span class="sub">${esc(a.at)}</span></div><div>${esc(a.msg)}</div><div class="row" style="margin-top:6px">${a.read?'':`<button class="btn sm" onclick="alarmRead('${a.id}')">확인</button>`}${a.resolved?'<span class="badge b-ok">해결됨</span>':`<button class="btn sm" onclick="alarmRes('${a.id}')">해결 처리</button>`}${a.seminarId&&S.seminars.some(s=>s.id===a.seminarId)?`<button class="btn sm" onclick="semModal('${a.seminarId}')">일정 보기</button>`:''}</div></div>`}
function alarmRead(id){S.alarms.find(a=>a.id===id).read=true;renderAll()}

/* ---------- 통계·이력 ---------- */
const did=(c,y)=>y===CUR?!!(semOf(c)&&semOf(c).status!=='proposed'):!!c.hist?.[y]?.done;
const pct=(a,b)=>b?Math.round(a/b*1000)/10+'%':'-';
function rStats(){
  const by=ui.yearBase,cy=by+1,cs=S.companies;
  const base=cs.filter(c=>did(c,by)),rejoin=base.filter(c=>did(c,cy)||(cy===CUR&&semOf(c))),replied=base.filter(c=>cy===CUR&&c.prefs.length===3);
  const neu=cs.filter(c=>!did(c,by)&&(did(c,cy)||(cy===CUR&&semOf(c)))),lost=base.filter(c=>!(did(c,cy)||(cy===CUR&&semOf(c))));
  const sent=cs.filter(c=>c.mail.sent),rep=sent.filter(c=>c.prefs.length===3),asg=cs.filter(c=>semOf(c)),cf=cs.filter(c=>semOf(c)&&semOf(c).status!=='proposed'),dn=cs.filter(c=>semOf(c)&&semOf(c).status==='done');
  const cities=[...new Set(cs.map(c=>regionOfLoc(c.city)).filter(Boolean))].sort();
  const withOrder=y=>cs.filter(c=>did(c,y)||(y===CUR&&semOf(c)));

  $('p-stats').innerHTML=`<div class="title-row"><div><h1>통계·이력</h1><div class="desc">연도별 진행 이력과 전환율. 올해 '진행'은 확정(또는 완료) 기준, 배정 제안은 '배정 포함'으로 따로 셉니다.</div></div><div class="row"><select onchange="ui.yearBase=+this.value;rStats()"><option value="2025">2025 → 2026 비교</option></select><button class="btn" onclick="exportCsv()">CSV 내려받기</button><button class="btn" onclick="importModal()">과거 업체 불러오기</button></div></div>

function parseCsv(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows}

      if(a[id]===undefined){const o=JSON.parse(b[id]);out.push({at,who,kind:'추가',col,target:labelOf(col,o),field:'',before:'',after:col==='세미나'?sname(o.staffId)+' '+o.date+' '+fmtT(o.start)+' ['+o.status+']':''})}

      else{const A=flat(JSON.parse(a[id]),'',{}),B=flat(JSON.parse(b[id]),'',{});const t=labelOf(col,JSON.parse(b[id]));for(const k of new Set([...Object.keys(A),...Object.keys(B)]))if(String(A[k])!==String(B[k]))out.push({at,who,kind:'수정',col,target:t,field:k,before:A[k]==null?'':A[k],after:B[k]==null?'':B[k]})}

    const pad=0.25;la0-=pad;la1+=pad;lo0-=pad;lo1+=pad;const W=640,H=Math.max(260,Math.min(420,640*(la1-la0)/((lo1-lo0)*0.82)));

function xMin(s){const t=String(s==null?'':s).trim().replace(/시\s*/,':').replace(/분$/,'');const m=/^(\d{1,2})(?::(\d{2})?(?::\d{2})?)?$/.exec(t);return m&&+m[1]<24&&+(m[2]||0)<60?+m[1]*60+ +(m[2]||0):null}
function xInterval(r){
  const parts=String(r.time||'').split(/\s*[~～–-]\s*/),a=xMin(r.startTime||parts[0]),b=xMin(r.endTime||parts[1]);
  if(r.allDay||/종일|출장|휴가|연차|반차/.test([r.type,r.title,r.siteName].join(' ')))return a!==null&&b!==null&&b>a?{start:a,end:b}:{start:0,end:1440,allDay:true};
  if(a!==null&&b!==null&&b>a)return {start:a,end:b};
  if(a!==null&&!r.endTime&&!parts[1]&&a+120<=1440)return {start:a,end:a+120,estEnd:true};
  return {start:0,end:1440,unknown:true};
}
function xVac(r){
  const parts=String(r.time||'').split(/\s*[~～–-]\s*/),a=xMin(r.start_time!=null?r.start_time:r.startTime!=null?r.startTime:parts[0]),b=xMin(r.end_time!=null?r.end_time:r.endTime!=null?r.endTime:parts[1]);
  const title=[r.vacation_type_title,r.title,r.siteName,r.dayType,r.period].filter(Boolean).join(' ');

function extNormalize(raw,hw){

  const el=$('extChip');if(!el)return;
  if(!extOn()){el.className='badge';el.textContent='일정 연동 꺼짐';return}
  if(EXT.busy&&!EXT.last){el.className='badge b-pri';el.textContent='일정 연동 중…';return}
  if(EXT.ok){el.className='badge b-ok';el.textContent='일정 연동 · '+new Date(EXT.last).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Seoul'})+(EXT.vacWarn?' ⚠':'')}
  else{el.className='badge b-bad';el.textContent=EXT.last?'일정 연동 오류 (이전 데이터 사용)':'일정 연동 오류'}
}
function extNames(){
  const cnt={};EXT.events.forEach(e=>e.names.forEach(n=>cnt[n]=(cnt[n]||0)+1));EXT.users.forEach(n=>{if(!(n in cnt))cnt[n]=0});
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}
function extPanelHtml(){
  const map=S.settings.extMap||{},rows=extNames(),on=extOn();
  const st=!on?'<span class="badge">꺼짐</span>':EXT.ok?'<span class="badge b-ok">연결됨 · 자동 동기화</span>':EXT.busy?'<span class="badge b-pri">연결 중…</span>':'<span class="badge b-bad">오류</span>';
  return `<div class="panel"><div class="ph">담당자 기존 일정 연동 ${st}<span class="sub">60초마다 자동으로 확인하고, 탭을 다시 열거나 인터넷이 다시 연결되면 바로 확인합니다 (읽기 전용)</span></div><div class="pb">
   <div class="row" style="margin-bottom:10px"><label style="display:flex;gap:6px;margin:0;color:var(--ink)"><input type="checkbox" ${on?'checked':''} onchange="S.settings.extOn=this.checked;save();if(this.checked)extSync();renderAll()"> 자동 연동 켜기</label><input style="flex:1;min-width:260px" value="${esc(S.settings.extUrl||'')}" placeholder="${esc(EXT_DEFAULT)}" onchange="S.settings.extUrl=this.value.trim();EXT.last=0;EXT.sig='';extSync()"><button class="btn sm" onclick="extSync()">지금 확인</button></div>
   <div class="sub">${EXT.last?'마지막 동기화 '+new Date(EXT.last).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · ':''}읽은 일정 ${EXT.counts.total}건(휴가 ${EXT.counts.vac}건) · 담당자 연결 안 된 일정 ${EXT.counts.unmatched}건${EXT.error?' · <b style="color:var(--bad)">'+esc(EXT.error)+'</b>':''}${EXT.vacWarn?' · <b style="color:var(--warn)">'+esc(EXT.vacWarn)+'</b>':''}</div>
   <h4>연동 이름 ↔ 담당자 연결</h4><div class="sub" style="margin-bottom:6px">이름이 같으면 자동 연결됩니다. 다르면 직접 골라 주세요. 연결되지 않은 일정은 배정 검사에 반영되지 않습니다.</div>
   <div class="tw" style="max-height:320px"><table style="min-width:0"><tr><th>연동 시스템의 이름</th><th>일정 수</th><th>우리 담당자</th></tr>${rows.map(([n,c])=>{const auto=(S.staff.find(p=>p.name===n)||{}).id||'',cur=map[n]||auto;return `<tr><td>${esc(n)}</td><td>${c}</td><td><select onchange="extMapSet('${esc(n).replace(/'/g,'&#39;')}',this.value)"><option value="">연결 안 함</option>${S.staff.map(p=>`<option value="${p.id}" ${cur===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${cur&&!map[n]?' <span class="sub">자동</span>':''}${!cur?` <button class="btn sm" onclick="extAddStaff(this.dataset.n)" data-n="${esc(n)}">담당자로 추가</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=3 class="sub">연동된 이름이 아직 없습니다.</td></tr>'}</table></div></div></div>`;
}
function extMapSet(n,v){S.settings.extMap=S.settings.extMap||{};if(v)S.settings.extMap[n]=v;else delete S.settings.extMap[n];extRebuild();extReact();renderAll()}
function extAddStaff(n){const id='st'+Date.now();S.staff.push({id,name:n,base:S.settings.baseCity,max:2,active:true,off:[]});extRebuild();renderAll();toast(n+' 담당자를 추가했습니다 (출발지를 확인하세요)')}
function extInit(){
  S.settings.extMap=S.settings.extMap||{};
  try{const c=JSON.parse(localStorage.getItem('seminar-ext-cache')||'null');if(c&&Array.isArray(c.events)){EXT.events=c.events;EXT.users=c.users||[];EXT.last=c.last||0;EXT.sig='';extRebuild()}}catch(e){}
  extChip();extSync();
  setInterval(extSync,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)extSync()});
  window.addEventListener('online',extSync);
  window.addEventListener('offline',()=>{EXT.ok=false;EXT.error='인터넷 연결 없음';extChip()});
}


S=load();resnap();renderAll();extInit();if(openCalls().length)showUrgent();sticky().forEach(c=>toast('📞 연락처 없음: '+c.name+' — 입력 전까지 계속 알립니다'));
</script>
</body>
</html>
